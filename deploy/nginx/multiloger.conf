# Example nginx TLS reverse proxy for Multiloger.
# Install: /etc/nginx/sites-available/multiloger, symlink into sites-enabled,
# then: certbot --nginx -d multiloger.example.com
#
# The API itself stays plain HTTP on 127.0.0.1:3000 (see the systemd unit);
# TLS terminates here. Never expose the API port directly.

upstream multiloger_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name multiloger.example.com;
    # Redirect everything to HTTPS (certbot manages the cert blocks below).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name multiloger.example.com;

    # Managed by certbot:
    # ssl_certificate /etc/letsencrypt/live/multiloger.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/multiloger.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Dashboard + API.
    location / {
        proxy_pass http://multiloger_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The dashboard uses a WebSocket for live profile events — keep it alive.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Let's not advertise the stack.
    server_tokens off;
    # Clickjacking / MIME-sniffing basics for the dashboard UI.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
